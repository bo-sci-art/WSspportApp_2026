<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ハザードマップ（対象区域の選定）</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 左：操作パネル -->
<div id="sidebar">
  <div class="side-scroll">
    <!-- 災害種フィルタ -->
    <div class="filter-label" style="margin-top:2px">災害の種類</div>
    <div class="filter-chips">
      <button class="chip active" data-cat="all">すべて</button>
      <button class="chip" data-cat="mizu">水害</button>
      <button class="chip" data-cat="jiban">地盤</button>
      <button class="chip" data-cat="jishin">地震</button>
    </div>

    <!-- 水害 -->
    <div class="hazard-group hg-mizu" data-cat="mizu">
      <div class="hg-head">水害</div>
      <div class="hg-body">
        <div class="fopt"><input type="checkbox" id="chk-flood_l2"><label for="chk-flood_l2">洪水（外水氾濫）</label><button class="info-btn" data-k="flood_l2">?</button></div>
        <div class="fopt"><input type="checkbox" id="chk-tsunami"><label for="chk-tsunami">津波</label><button class="info-btn" data-k="tsunami">?</button></div>
        <div class="fopt"><input type="checkbox" id="chk-hightide"><label for="chk-hightide">高潮</label><button class="info-btn" data-k="hightide">?</button></div>
      </div>
    </div>

    <!-- 地盤 -->
    <div class="hazard-group hg-jiban" data-cat="jiban">
      <div class="hg-head">地盤</div>
      <div class="hg-body">
        <div class="fopt"><input type="checkbox" id="chk-kyukei"><label for="chk-kyukei">土砂災害（急傾斜地の崩壊）</label><button class="info-btn" data-k="kyukei">?</button></div>
        <div class="fopt"><input type="checkbox" id="chk-swale"><label for="chk-swale">液状化に関わる低地</label><button class="info-btn" data-k="swale">?</button></div>
      </div>
    </div>

    <!-- 地震 -->
    <div class="hazard-group hg-jishin" data-cat="jishin">
      <div class="hg-head">地震</div>
      <div class="hg-body">
        <a class="ext-link" href="https://wwwm.city.yokohama.lg.jp/yokohama/yokohama/Content/pages/links/6_bosai/links.html" target="_blank" rel="noopener">
          🔗 わいわい防災マップ（横浜市）で見る
          <small>震度・地震火災（延焼）などは横浜市の防災マップへ（外部サイト）</small>
        </a>
      </div>
    </div>

    <!-- 凡例・説明 -->
    <div class="filter-label" style="margin-top:16px">凡例・説明</div>
    <div id="legend-box"><div class="legend-empty">災害を選ぶと、説明と凡例が表示されます</div></div>
  </div>
</div>

<!-- 地図 -->
<div id="map-area">
  <div id="viewDiv"></div>
  <div id="basemap-toggle"><button id="bm-white" class="active">白地図</button><button id="bm-sat">衛星画像</button></div>
  <div class="attr">出典：<a href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a>（地理院タイル／重ねるハザードマップ）</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
